name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # 予約公開（publishAt / 未来の pubDate）の記事を出すため、毎日 0:00 と 19:00（日本時間）にビルドし直す。
  # GitHub の schedule は数分〜数十分遅れることがある
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
